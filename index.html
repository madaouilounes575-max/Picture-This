<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <title>Picture This!</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="header">
    <div class="title">
      <h1>Picture This!</h1>
      <h4>My Really Cool Blog Post</h4>
    </div>
 <!-- The picture element provides different image sources depending on the viewport size-->
<picture>
  <!-- Square images are selected when the viewport is 960px or wider-->
   <source
  media="(min-width: 960px)"
  srcset="
    images/square/museum-480x480.jpg 480w,
    images/square/museum-640x640.jpg 640w,
    images/square/museum-800x800.jpg 800w,
    images/square/museum-960x960.jpg 960w,
    images/square/museum-1280x1280.jpg 1280w,
    images/square/museum-1440x1440.jpg 1440w,
    images/square/museum-1600x1600.jpg 1600w,
    images/square/museum-1920x1920.jpg 1920w,
    images/square/museum-2400x2400.jpg 2400w
  "
  sizes="(min-width: 960px) 640px, 100vw"
>
<!-- Landscape versions are selected below 960px to provide the appropriate image ratio for 
 smaller screens-->
    <img
  src="images/museum.jpg"
  srcset="
    images/landscape/museum-320x.jpg 320w,
    images/landscape/museum-480x.jpg 480w,
    images/landscape/museum-720x.jpg 720w,
    images/landscape/museum-960x.jpg 960w,
    images/landscape/museum-1440x.jpg 1440w,
    images/landscape/museum-2160x.jpg 2160w
  "
  sizes="100vw"
  alt="Museum gallery"
>

    </picture>  

  </header>
</body>

</html>
